<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style></style>
</head>
<body>
    <h1>Animate.css</h1>
    <p id="p1">MiParrafoUno</p>
    <button onclick="addBounce()">Bounce</button>
    <script>
        function addBounce() {
            document.querySelector('#p1').classList.toggle('animate__animated')
            document.querySelector('#p1').classList.toggle('animate__bounce')
        }
    </script>
</body>
</html>
