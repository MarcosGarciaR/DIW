<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen CSS Grid</title>
    <link rel="stylesheet" href="./style.css">
	<!-- No olvides enlazar el .css-->
</head>
<body>
    <h2>Ejercicio 3: Formulario con Grid y Span</h2>
<div class="form-container">
    <h3 class="form-title">Registro de Usuario</h3>
    
    <input type="text" placeholder="Nombre">
    <input type="text" placeholder="Apellido">
    
    <input type="email" class="full-width" placeholder="Correo Electrónico">
    
    <input type="password" placeholder="Contraseña">
    <input type="password" placeholder="Confirmar Contraseña">
    
    <textarea class="full-width" rows="3" placeholder="Dirección completa"></textarea>
    
    <button class="btn-submit">Registrarse</button>
</div>
</body>
</html>
